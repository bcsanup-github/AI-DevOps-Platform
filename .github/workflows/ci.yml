name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: sanupdocker/ai-devops-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check VM is reachable
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        run: |
          # Strip spaces/newlines that sneak in when pasting secrets
          HOST="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          USER_NAME="$(printf '%s' "$VM_USERNAME" | tr -d '[:space:]')"
          echo "VM_HOST length: ${#VM_HOST} raw, ${#HOST} after trimming"

          if timeout 10 bash -c "</dev/tcp/$HOST/22"; then
            echo "Port 22 is reachable"
          else
            echo "::error::Cannot reach port 22 on VM_HOST. Make sure the VM_HOST secret holds the current VM IP (terraform output vm_public_ip)."
            exit 1
          fi

          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$USER_NAME" >> "$GITHUB_ENV"

      - name: Deploy to Azure K3s Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/azureuser/.kube/config
            kubectl rollout restart deployment/backend
            kubectl rollout status deployment/backend --timeout=60s
