name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: sanupdocker/ai-devops-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check VM is reachable
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "VM_HOST length: ${#VM_HOST} characters"
          if timeout 10 bash -c "</dev/tcp/$VM_HOST/22"; then
            echo "Port 22 is reachable"
          else
            echo "::error::Cannot reach port 22 on VM_HOST. Make sure the VM_HOST secret holds the current VM IP (terraform output vm_public_ip)."
            exit 1
          fi

      - name: Deploy to Azure K3s Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/azureuser/.kube/config
            kubectl rollout restart deployment/backend
            kubectl rollout status deployment/backend --timeout=60s
