name: AI DevOps CI pipeline

on:
  push:
    branches: 
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
      - uses: actions/checkout@v4

      - name: set up docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/ai-devops-backend:latest \
          ./backend
        
      - name: install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget -y
          wget https://github.com/aquasecurity/trivy/release/latest/download/trivy_0.67.2_Linux-64bit.dockerhub
          sudo dpkg -i trivy_0.67.2_linux-64bit.deb

      - name: scan docker image
        run: |
          trivy image \
          --severity HIGH,CRITICAL \
          ${{ secrets.DOCKER_USERNAME }}/ai-devops-backend:latest

      - name: push docker image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/ai-devops-backend:latest