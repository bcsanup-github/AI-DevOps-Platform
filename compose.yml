services:

  backend:
    build:
      context: ./backend

    container_name: ai-backend

    restart: unless-stopped

    ports:
      # Change the host port with APP_PORT if 8000 is busy, e.g. APP_PORT=8080
      - "${APP_PORT:-8000}:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      OLLAMA_HOST: http://ollama:11434

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  postgres:
    image: postgres:17-alpine

    container_name: ai-postgres

    restart: unless-stopped

    env_file:
      - .env

    # Only reachable from the other containers; uncomment to use a local DB client
    # ports:
    #   - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:0.11.4

    container_name: ai-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
