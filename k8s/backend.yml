apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sanupdocker/ai-devops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "chat_history"
            - name: POSTGRES_HOST
              value: "ai-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: OLLAMA_HOST
              value: "http://ai-ollama:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: backend